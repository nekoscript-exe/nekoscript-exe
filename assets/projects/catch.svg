<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 460 240">
  <title>CATCH CONSULTING - Data &amp; Business Intelligence</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#141624"/>
      <stop offset="1" stop-color="#101c29"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="458" height="238" rx="14"
    fill="url(#bg)" stroke="#60a5fa" stroke-opacity=".55"/>

  <rect x="25" y="23" width="65" height="65" rx="12"
    fill="#60a5fa" fill-opacity=".08"/>

  <g transform="translate(25 23) scale(.8)"
    fill="none" stroke="#60a5fa" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 65 H65 M20 55 V40 H30 V55 Z M35 55 V30 H45 V55 Z M50 55 V15 H60 V55 Z"/>
  </g>

  <g font-family="Arial,sans-serif">
    <text x="25" y="117" font-size="25" font-weight="bold"
      fill="#60a5fa">CATCH CONSULTING</text>
    <text x="25" y="143" font-size="17"
      fill="#e6edf3">Data &amp; Business Intelligence</text>
    <text x="25" y="166" font-size="14"
      fill="#94a3b8">Workforce analytics and indicators</text>

    <path d="M25 181 H435" stroke="#293449"/>

    <text x="25" y="201" font-size="12"
      fill="#b9c5d4">Python / Data Analytics</text>
    <text x="25" y="224" font-size="11"
      letter-spacing="2" fill="#60a5fa">PRIVATE PROJECT</text>

    <path d="M415 211 H430 V196 M415 211 L430 196"
      fill="none" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <circle cx="58" cy="55" r="43"
    fill="#60a5fa" opacity=".045"/>

  <text id="project-category" x="435" y="40"
    text-anchor="end" font-family="monospace"
    font-size="11" fill="#60a5fa">03 / PRIVATE PROJECT</text>

  <path d="M350 50 H435"
    stroke="#60a5fa" stroke-opacity=".3"/>

  <circle cx="435" cy="62" r="3" fill="#60a5fa">
    <animate attributeName="opacity"
      values="1;.3;1" dur="3s"
      repeatCount="indefinite"/>
  </circle>
</svg>
