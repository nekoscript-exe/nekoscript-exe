name: Update developer metrics

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_metrics.py

      - name: Validate SVG
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/branding/metrics.svg'); ET.parse('assets/branding/languages.svg')"

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/branding/metrics.svg assets/branding/languages.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update developer metrics"
            git push
          fi
