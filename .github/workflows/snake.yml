name: Generate contribution snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a78bfa&color_dots=#ebedf0,#b5e8dc,#69cbb4,#359b85,#176b58
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#202337,#173c3b,#23685c,#38a88e,#69edc5

      - name: Validate generated SVG files
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ("snake.svg", "snake-dark.svg"):
              path = Path("dist") / name
              assert path.is_file(), f"Missing file: {path}"
              assert path.stat().st_size > 0
              ET.parse(path)
              print(f"Valid SVG: {path}")
          PYTHON

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
